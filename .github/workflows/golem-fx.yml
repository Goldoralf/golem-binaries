# SPDX-License-Identifier: GPL-3.0-or-later
# Builds golem's own effects (golem-fx, https://github.com/Goldoralf/golem-fx) as VST3 for Linux, Windows and macOS
# from one golem-fx tag, and publishes them as one release: one archive per OS, the factory presets as
# .vstpreset (golem-fx-vstpresets.zip), SHA256SUMS, BUILDINFO.txt.
# golem-fx-<os>.* is what golem installs and plays (no editor). From 0.7 on, the tag also builds every pedal WITH
# its editor (gfx-ui, `cargo xtask dist`), the build a DAW opens: golem-fx-<os>-editor.*, beside it, never in its place.
# From 0.8.2 on, each pedal of that editor build also has its own archive, <crate>-<os>-editor.zip.
# It starts by itself for each new golem-fx tag (golem-fx-watch.yml). To run it by hand: Actions ▸ golem-fx ▸
# Run workflow, with the golem-fx tag (e.g. 0.4); the release is golem-fx-<tag>.
name: golem-fx
# The watcher recognises a tag it has already launched by this title.
run-name: golem-fx ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "golem-fx tag to build (e.g. 0.4)"
        required: true
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Goldoralf/golem-fx
          ref: ${{ inputs.ref }}
          path: golem-fx
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ runner.os }}" = macOS ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi
      - name: Bundle every pedal (bundler.toml, without dev tools)
        working-directory: golem-fx
        run: |
          # Every [gfx-*] section of bundler.toml is a pedal; gfx-gapmeter is a measuring probe, not a block.
          pkgs=$(grep -oE '^\[gfx-[a-z0-9-]+\]' bundler.toml | tr -d '[]' | grep -vx 'gfx-gapmeter')
          # One package per call: a few pedals reuse another pedal's processor (gfx-transient → gfx-limiter,
          # gfx-mbcomp → gfx-comp…) without its plugin feature, and building them together would unify the
          # features and link two VST3 entry points into one library.
          if [ "${{ runner.os }}" = macOS ]; then cmd=bundle-universal; else cmd=bundle; fi
          for p in $pkgs; do cargo xtask $cmd "$p" --release; done
          echo "$pkgs" > ../pedals.txt
          # Keep golem's bundles apart: the editor build below writes target/bundled again.
          mv target/bundled ../headless
      - name: Every pedal with its editor (gfx-ui), for a DAW
        working-directory: golem-fx
        run: |
          # Tags older than gfx-ui have no `xtask dist`: the release then goes out without the editor build.
          if grep -q '"dist"' xtask/src/main.rs; then
            cargo xtask dist --no-archive
            mv "dist/vst3/${{ matrix.name }}" ../editor
          fi
      - name: Ad-hoc code signature (macOS, required on Apple silicon)
        if: runner.os == 'macOS'
        run: for b in headless/*.vst3 editor/*.vst3; do [ -e "$b" ] && codesign --force --deep --sign - "$b"; done; true
      - name: Archive
        run: |
          mkdir out
          pack() { # <folder> <archive name without extension>
            (cd "$1" && if [ "${{ runner.os }}" = Windows ]; then 7z a -tzip "../out/$2.zip" ./*.vst3 > /dev/null
                        else tar czf "../out/$2.tar.gz" ./*.vst3; fi)
          }
          pack headless "golem-fx-${{ matrix.name }}"
          if [ -d editor ]; then pack editor "golem-fx-${{ matrix.name }}-editor"; fi
          # From 0.8.2 on, each pedal alone too, with its editor (golem.fm/fx offers it on the pedal's card):
          # <crate>-<os>-editor.zip (e.g. gfx-dist-linux-x86_64-editor.zip), a zip on every OS, holding <name>.vst3.
          if [ -d editor ]; then
            awk '/^\[gfx-/ { k = $0; gsub(/[][]/, "", k) } /^name *=/ { sub(/^name *= *"/, ""); sub(/".*$/, ""); print k "\t" $0 }' \
              golem-fx/bundler.toml | while IFS=$'\t' read -r krate name; do
              [ -d "editor/$name.vst3" ] || continue
              if [ "${{ runner.os }}" = Windows ]; then (cd editor && 7z a -tzip "../out/$krate-${{ matrix.name }}-editor.zip" "./$name.vst3" > /dev/null)
              else (cd editor && zip -qryX "../out/$krate-${{ matrix.name }}-editor.zip" "$name.vst3"); fi
            done
          fi
          {
            echo "[${{ matrix.name }}] golem-fx $(git -C golem-fx rev-parse HEAD) (tag ${{ inputs.ref }}), runner ${{ matrix.os }}"
            echo "  $(rustc --version), $(cargo --version)"
            echo "  $(ls headless | grep -c '\.vst3$') VST3: $(tr '\n' ' ' < pedals.txt)"
            if [ -d editor ]; then echo "  -editor: $(ls editor | grep -c '\.vst3$') VST3 with the editor (gfx-ui), $(ls out | grep -c '^gfx-.*-editor\.zip$') alone (<crate>-<os>-editor.zip)"; fi
          } > "out/BUILDINFO-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - uses: actions/checkout@v4
        with:
          repository: Goldoralf/golem-fx
          ref: ${{ inputs.ref }}
          path: golem-fx
      - name: Factory presets as VST3 presets (.vstpreset)
        run: |
          # golem-fx's exporter (stdlib Python) writes <out>/GoleM/<Plugin>/<Preset>.vstpreset; the zip holds
          # the GoleM folder, to unzip into the OS's VST3 preset folder (golem-fx presets/README.md).
          # Tags older than the exporter have none: the release then goes out without it.
          mkdir presets-out
          if [ -f golem-fx/tools/export-vstpresets.py ]; then
            python3 golem-fx/tools/export-vstpresets.py --out vstpresets
            (cd vstpresets && zip -qrX ../presets-out/golem-fx-vstpresets.zip GoleM)
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && find dl -type f -exec cp {} out/ \;
          if [ -f presets-out/golem-fx-vstpresets.zip ]; then cp presets-out/golem-fx-vstpresets.zip out/; fi
          (cd out && cat BUILDINFO-*.txt > BUILDINFO.txt && rm BUILDINFO-*.txt \
            && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > SHA256SUMS)
          {
            echo "golem's own effects, built from [golem-fx](https://github.com/Goldoralf/golem-fx/tree/${{ inputs.ref }}) tag \`${{ inputs.ref }}\`"
            echo "(GPL-3.0-or-later; the source is that tag) by [.github/workflows/golem-fx.yml](.github/workflows/golem-fx.yml),"
            echo "run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            echo "macOS bundles are universal (x86_64 + arm64) with an ad-hoc signature, not notarized."
            if ls out/*-editor.* > /dev/null 2>&1; then
              echo "\`golem-fx-<os>.*\`: what golem installs and plays (no editor). \`golem-fx-<os>-editor.*\`: the same pedals with"
              echo "their editor (gfx-ui), for a DAW: unpack into the OS's VST3 folder. \`<crate>-<os>-editor.zip\` (e.g."
              echo "\`gfx-dist-linux-x86_64-editor.zip\`): one of those pedals alone."
            fi
            if [ -f out/golem-fx-vstpresets.zip ]; then
              echo "\`golem-fx-vstpresets.zip\`: the factory presets as VST3 presets, a \`GoleM\` folder to unzip into the OS's VST3 preset folder"
              echo "(see [presets/README.md](https://github.com/Goldoralf/golem-fx/blob/${{ inputs.ref }}/presets/README.md#presets-in-a-daw))."
            fi
            echo; echo '```'; cat out/BUILDINFO.txt; echo; cat out/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "golem-fx-${{ inputs.ref }}" out/* --repo "${{ github.repository }}" \
            --title "golem-fx ${{ inputs.ref }} (VST3: Linux, Windows, macOS)" --notes-file notes.md --latest=false --target "${{ github.sha }}"
