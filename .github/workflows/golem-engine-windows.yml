# SPDX-License-Identifier: GPL-3.0-or-later
# EXPERIMENT — the Golem Engine on Windows (golem docs/install-v2.md, the port). Builds Goldoralf/golem-engine natively
# with MSYS2/MinGW-w64 on a Windows runner and uploads what it produced (logs, and the headless engine if it built).
# It publishes NO release: this workflow exists to find out what the port needs, one run at a time.
# Ardour's own Windows builds are cross-compiled on Linux with a dependency stack built by tools that are not public;
# MSYS2 packages most of that stack.
name: golem-engine-windows (experiment)
run-name: golem-engine-windows ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "golem-engine branch or tag to build"
        required: true
        default: main
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64          # MINGW64 was deprecated in March 2026: its packages are gone
          update: true
          install: git base-devel
      - name: Dependencies (every one tried; a missing package is listed, not fatal)
        run: |
          # the list of the Ardour forum's MSYS2 recipe (discourse.ardour.org/t/112412, posts 69-80), plus what golem's
          # engine needs (libxml2, lv2, soundtouch…)
          P=mingw-w64-ucrt-x86_64
          missing=""
          for p in toolchain pkgconf python boost glib2 glibmm libsndfile curl libarchive fftw liblo taglib vamp-plugin-sdk \
                   rubberband aubio portaudio cairomm pangomm serd sord sratom lilv lv2 libwebsockets cmake libusb \
                   libjpeg-turbo lrdf libxml2 cppunit libsamplerate soundtouch readline harfbuzz fribidi libpng libtiff \
                   fontconfig freetype libepoxy gettext itstool libogg libvorbis flac opus; do
            pacman -S --noconfirm --needed $P-$p > /tmp/pac.log 2>&1 || { missing="$missing $p"; echo "--- $p"; tail -2 /tmp/pac.log; }
          done
          echo "MISSING PACKAGES:$missing" | tee /tmp/missing.txt
          gcc --version | head -1
          # the recipe's two temporary pkg-config fixes, applied once
          grep -q systre /ucrt64/lib/pkgconfig/portaudio-2.0.pc || sed -i '/^Libs:/ s/$/ -lsystre/' /ucrt64/lib/pkgconfig/portaudio-2.0.pc || true
          grep -q sratom-0 /ucrt64/lib/pkgconfig/lilv-0.pc || sed -i '/^Libs:/ s/$/ -lsratom-0 -lsord-0 -lserd-0/' /ucrt64/lib/pkgconfig/lilv-0.pc || true
      - name: Sources
        run: |
          git config --global core.autocrlf false
          git clone https://github.com/Goldoralf/golem-engine.git engine
          cd engine && git checkout "${{ inputs.ref }}" && git describe HEAD
      - name: Configure
        working-directory: engine
        run: |
          set +e
          # MinGW's Python says "win32", and waf then looks for MSVC first: name the compilers
          python ./waf configure --check-c-compiler=gcc --check-cxx-compiler=g++ --dist-target=mingw --configdir=share \
            --no-execstack --no-dr-mingw --cxx17 --ptformat --program-name="Golem Engine" --with-backends=dummy,portaudio \
            --optimize 2>&1 | tee /tmp/configure.log
          echo "configure rc=${PIPESTATUS[0]}" | tee -a /tmp/configure.log
      - name: Build (as far as it goes)
        working-directory: engine
        run: |
          set +e
          python ./waf build -j4 -k > /tmp/build-full.log 2>&1
          echo "build rc=$?" | tee /tmp/build-tail.log
          tail -60 /tmp/build-full.log >> /tmp/build-tail.log
          # every compiler or linker error with its context: what the port has to fix
          grep -n -B3 -A8 -E "error:|undefined reference|fatal error" /tmp/build-full.log | head -1500 > /tmp/errors.txt || true
          grep -c -E "error:|undefined reference" /tmp/build-full.log || true
          ls -la build/luasession/ 2>/dev/null | tee /tmp/luasession.txt
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp /tmp/missing.txt /tmp/configure.log /tmp/build-tail.log /tmp/luasession.txt out/ 2>/dev/null || true
          cp engine/build/config.log out/ 2>/dev/null || true
          cp engine/build/luasession/*.exe out/ 2>/dev/null || true
          cp /tmp/errors.txt out/ 2>/dev/null || true
          gzip -c /tmp/build-full.log > out/build-full.log.gz 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golem-engine-windows-experiment
          path: out/
